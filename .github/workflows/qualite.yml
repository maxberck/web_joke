name: Qualité du quiz

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Validation contenu et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Le lockfile actuel provient d'une version antérieure du monorepo.
      # npm ci refuse donc l'installation avant même d'atteindre nos validations.
      # On utilise temporairement npm install sans réécrire le lockfile du dépôt.
      # Une fois le lockfile régénéré proprement, cette étape devra revenir à npm ci.
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Valider le contenu
        run: npm run content:validate

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire l'application
        run: npm run build
