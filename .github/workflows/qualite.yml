name: Qualité du quiz

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Validation contenu et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider le contenu
        run: npm run content:validate

      - name: Vérifier les baselines de matching
        run: |
          BASELINE_OUTPUT=/tmp/matchBaselines.json BASELINE_SAMPLES=50000 npm run sim:build-baselines
          node --input-type=module -e "import fs from 'node:fs'; const committed=JSON.parse(fs.readFileSync('src/data/matchBaselines.json','utf8')); const generated=JSON.parse(fs.readFileSync('/tmp/matchBaselines.json','utf8')); if (JSON.stringify(committed)!==JSON.stringify(generated)) { console.error('Les baselines versionnées ne correspondent plus aux 50 000 simulations.'); process.exit(1); } console.log('Baselines versionnées conformes aux 50 000 simulations.');"

      - name: Vérifier la calibration d'apparition
        run: |
          APPEARANCE_OUTPUT=/tmp/appearanceCalibration.json APPEARANCE_SAMPLES=200000 npm run sim:build-appearance
          node --input-type=module -e "import fs from 'node:fs'; const committed=JSON.parse(fs.readFileSync('src/data/appearanceCalibration.json','utf8')); const generated=JSON.parse(fs.readFileSync('/tmp/appearanceCalibration.json','utf8')); if (JSON.stringify(committed)!==JSON.stringify(generated)) { console.error('La calibration versionnée ne correspond plus aux 200 000 simulations.'); process.exit(1); } console.log('Calibration versionnée conforme aux 200 000 simulations.');"

      - name: Valider la rareté hybride
        run: npm run rarity:validate

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire l'application
        run: npm run build
