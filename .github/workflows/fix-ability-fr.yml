name: Correction FR capacités

on:
  push:
    branches: [fix/qualite-editoriale-resultats]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-ability-fr]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qualite-editoriale-resultats
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corriger les noms FR
        run: node content-pipeline/scripts/fixAbilityFrenchLabels.mjs
      - name: Vérifier le contenu
        run: npm run content:validate
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/abilities.json
          git commit -m "fix: corriger les noms FR des capacités"
          git push origin HEAD:fix/qualite-editoriale-resultats
