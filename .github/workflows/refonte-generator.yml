name: Générer la refonte du contenu

on:
  push:
    branches: [feat/refonte-contenu-massive]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ contains(github.event.head_commit.message, '[run-refonte-generator]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: feat/refonte-contenu-massive
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le manifest historique
        run: node content-pipeline/scripts/buildLegacyManifest.mjs

      - name: Canonicaliser les données historiques
        run: node content-pipeline/scripts/canonicalizeData.mjs

      - name: Vérifier la migration générée
        run: node content-pipeline/scripts/validateCanonicalMigration.mjs

      - name: Committer les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-pipeline/fixtures/legacy-content-manifest.json src/data/questions src/data/careers.json src/data/classes.json src/data/powers.json src/data/weaknesses.json src/data/abilities.json src/data/workStyles.json src/data/animals.json src/data/synergyRules.json
          if git diff --cached --quiet; then
            echo "Aucun fichier généré à committer."
            exit 0
          fi
          git commit -m "data: générer la refonte du contenu [refonte-generated]"
          git push origin HEAD:feat/refonte-contenu-massive

  merge-baselines:
    if: ${{ contains(github.event.head_commit.message, '[run-baseline-merge]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: feat/refonte-contenu-massive
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Fusionner les baselines
        run: node content-pipeline/scripts/mergeLegacyBaselines.mjs

      - name: Committer les baselines fusionnées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/matchBaselines.json
          if git diff --cached --quiet; then
            echo "Aucune baseline à committer."
            exit 0
          fi
          git commit -m "data: fusionner les baselines historiques [refonte-generated]"
          git push origin HEAD:feat/refonte-contenu-massive

  expand-content:
    if: ${{ contains(github.event.head_commit.message, '[run-content-expansion-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: feat/refonte-contenu-massive
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Étendre les questions
        run: node content-pipeline/scripts/expandQuestionsTo150.mjs

      - name: Doubler les catalogues de résultats
        run: node content-pipeline/scripts/expandResultCatalogsV2.mjs

      - name: Vérifier la conservation historique
        run: node content-pipeline/scripts/validateCanonicalMigration.mjs

      - name: Vérifier les volumes générés
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const q=['work','social','life','personality','general']; for(const n of q){const a=JSON.parse(fs.readFileSync('src/data/questions/'+n+'.json')); if(a.length!==30) throw new Error(n+': '+a.length);} const targets={careers:200,classes:150,powers:150,weaknesses:150,abilities:150,workStyles:150,animals:150,synergyRules:200}; for(const [n,c] of Object.entries(targets)){const a=JSON.parse(fs.readFileSync('src/data/'+n+'.json')); if(a.length!==c) throw new Error(n+': '+a.length+' != '+c);} console.log('Volumes V2 générés conformes.');"

      - name: Committer le contenu étendu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questions src/data/careers.json src/data/classes.json src/data/powers.json src/data/weaknesses.json src/data/abilities.json src/data/workStyles.json src/data/animals.json src/data/synergyRules.json
          if git diff --cached --quiet; then
            echo "Aucun contenu étendu à committer."
            exit 0
          fi
          git commit -m "data: doubler les catalogues du quiz [refonte-generated]"
          git push origin HEAD:feat/refonte-contenu-massive
