name: Génération éditoriale contrôlée

on:
  push:
    branches: [fix/qualite-editoriale-resultats]

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[editorial-generate]')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: fix/qualite-editoriale-resultats
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Enrichir les catalogues
        run: node content-pipeline/scripts/enrichResultCatalogsEditorial.mjs

      - name: Valider les descriptions et profils
        run: npm run content:validate

      - name: Régénérer les baselines
        run: BASELINE_OUTPUT=src/data/matchBaselines.json BASELINE_SAMPLES=50000 npm run sim:build-baselines

      - name: Régénérer la calibration
        run: APPEARANCE_OUTPUT=src/data/appearanceCalibration.json APPEARANCE_SAMPLES=200000 npm run sim:build-appearance

      - name: Vérification complète avant commit
        run: |
          npm run content:validate
          npm run rarity:validate
          npm run typecheck
          npm run build

      - name: Committer les données enrichies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/careers.json src/data/classes.json src/data/powers.json src/data/weaknesses.json src/data/abilities.json src/data/workStyles.json src/data/animals.json src/data/matchBaselines.json src/data/appearanceCalibration.json
          if git diff --cached --quiet; then
            echo "Aucune donnée à committer"
            exit 0
          fi
          git commit -m "fix: enrichir les résultats et recalibrer"
          git push origin HEAD:fix/qualite-editoriale-resultats

# Déclencheur ponctuel de génération éditoriale — tentative 2.
